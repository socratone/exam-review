# Use after `modal token new` has created ~/.modal.toml.
# 클라우드 호출·배포 때 기본 Compose 파일과 함께 사용한다. 인증 파일은 읽기 전용이다.
services:
  exam-checker:
    volumes:
      - type: bind
        source: ${HOME}/.modal.toml
        target: /root/.modal.toml
        read_only: true
        bind:
          # 인증 파일이 없을 때 같은 이름의 디렉터리를 자동 생성하지 않고 실패시킨다.
          create_host_path: false
