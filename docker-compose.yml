services:
  exam-checker:
    build: .
    working_dir: /app
    # 소스와 입력은 읽기 전용, 결과 폴더는 쓰기 가능하도록 연결한다.
    volumes:
      - ./:/app:ro
      - ./data:/data:ro
      - ./output:/output
    environment:
      # Compose가 .env 또는 셸 환경변수를 읽고, 미설정이면 아래 기본값을 전달한다.
      EXAM_CHECKER_RENDER_DPI: ${EXAM_CHECKER_RENDER_DPI:-160}
      EXAM_CHECKER_GPU: ${EXAM_CHECKER_GPU:-L4}
      EXAM_CHECKER_MODAL_APP: ${EXAM_CHECKER_MODAL_APP:-exam-checker}
      EXAM_CHECKER_MODEL: ${EXAM_CHECKER_MODEL:-Qwen/Qwen3-VL-8B-Instruct}
    entrypoint: ["python", "-m", "exam_checker.cli"]
