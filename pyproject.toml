[project]
name = "exam-checker"
version = "0.1.0"
description = "Local PDF preprocessing for exam review"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.26,<2",
    "typer>=0.16,<1",
    "pydantic>=2.11,<3",
    "modal>=1.0,<2",
]

[project.scripts]
exam-checker = "exam_checker.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
